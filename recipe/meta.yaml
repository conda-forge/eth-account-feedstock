z{% set name = "eth-account" %}
{% set version = "0.14.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/eth_account-{{ version }}.tar.gz
  sha256: 2c8291b1a8fcbd29a55b07f75f0a0aaffd04704d3ec28d1396587f18a5541c6d

build:
  number: 0
  noarch: python
  script:
    - export SETUPTOOLS_SCM_PRETEND_VERSION="{{ version }}"
    - python -m pip install . -vv
    - rm -rf ${SP_DIR}/docs   # [unix]
    - rmdir /s /q %SP_DIR%\docs   # [win]

outputs:
  - name: eth-account
    build:
      noarch: python
    requirements:
      host:
        - pip
        - python {{ python_min }}
        - setuptools
        - setuptools-scm
      run:
        - python >={{ python_min }}
        - bitarray >=2.4.0
        - eth-abi >=4.0.0
        - eth-keyfile >=0.10.0
        - eth-keys >=0.5.0
        - eth-rlp >=3.0.0
        - eth-utils >=6.0.0
        - hexbytes >=2.0.0
        - rlp >=2.0.0
        - ckzg >=2.0.0
        - pydantic >=2.0.0
    test:
      requires:
        - python {{ python_min }}
        - pip
      commands:
        - pip check
      imports:
        - eth-account

  - name: eth_account
    build:
      noarch: python
    requirements:
      run:
        - {{ pin_subpackage('eth-account', max_pin="x.x.x") }}
    test:
      imports:
        - eth_account


about:
  home: https://github.com/ethereum/eth-account
  summary: 'eth-account: Sign Ethereum transactions and messages with local private keys'
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - step21
